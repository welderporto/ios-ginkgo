name: gpu-userland

# GPU user space for iOS 16.7.16 (Mesa freedreno + EAGL + backboardd injection), see userland/build-gpu.sh.
# Only open-source code is built and uploaded; no Apple binaries are in the artifact.
on:
  workflow_dispatch:
  push:
    branches: [ginkgo]
    paths:
      - "userland/**"
      - ".github/workflows/gpu-userland.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          brew install meson ninja bison
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      - name: Build
        run: bash userland/build-gpu.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-userland
          path: userland/out/
          retention-days: 14
